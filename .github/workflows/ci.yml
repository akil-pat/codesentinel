name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  # Eval job replays recorded API responses (eval/cassettes/) by default —
  # this measures scorer/prompt consistency against history, not live model
  # drift. A separate weekly workflow re-runs against the live API.
  eval:
    runs-on: ubuntu-latest
    needs: lint-and-test
    # No cassettes have been recorded yet (no live API credential was
    # available while building this) — this job WILL fail until someone
    # with API access runs `python -m eval.run_eval --mode record` once.
    # continue-on-error keeps that visible without blocking merges in the
    # meantime; remove it once real cassettes exist under eval/cassettes/.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # -m, not `python eval/run_eval.py`: the latter puts eval/ itself on
      # sys.path[0] instead of the repo root, breaking `from eval.scorer
      # import ...` inside run_eval.py.
      - run: python -m eval.run_eval --mode replay --strict-cassettes
