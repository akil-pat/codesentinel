name: Live Eval (weekly)

# Runs the eval against the real Anthropic API, distinct from ci.yml's
# replay-mode job — this is the one that actually measures current model
# behavior rather than agreement with a fixed recorded history. See
# eval/dataset/RUBRIC.md for why that distinction matters for what a
# score can honestly claim.
#
# Requires an ANTHROPIC_API_KEY repository secret (Settings → Secrets and
# variables → Actions). This workflow does nothing useful without one —
# it will fail clearly rather than silently skip, so that's visible.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  live-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run eval against the live API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m eval.run_eval --mode live --split test --output live-eval-results.json
      - name: Summarize
        if: always()
        run: |
          {
            echo "### Live eval result ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            echo '```json'
            cat live-eval-results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-results
          path: live-eval-results.json
