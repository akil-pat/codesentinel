[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codesentinel"
version = "0.1.0"
description = "An LLM code-review agent with a measured evaluation harness, usable as a CLI or a GitHub webhook service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akil Pat", email = "akilpat.dev@gmail.com" }]
dependencies = [
    # Pinned exactly, not a floor: Tool Runner (client.beta.messages.tool_runner)
    # is a beta SDK surface and can change shape between releases.
    "anthropic==1.8.0",
    "typer>=0.15.0",
    "unidiff>=0.7.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "vcrpy>=6.0.0",
]

[project.scripts]
codesentinel = "codesentinel.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"
# Deliberately buggy fixture repos, not maintained project code — linting
# them would either fight the intentional bugs or mask real issues in
# actual source under noise from fixtures.
extend-exclude = ["eval/dataset/*/repo"]

[tool.hatch.build.targets.wheel]
packages = ["src/codesentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
